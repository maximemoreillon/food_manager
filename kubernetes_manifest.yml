apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-manager
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: food-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: food-manager
    spec:
      containers:
        - name: food-manager
          image: ${CONTAINER_IMAGE_TAGGED}
          env:
            - name: S3_BUCKET
              value: food-manager
            - name: S3_ENDPOINT
              value: rustfs.rustfs
            - name: S3_PORT
              value: "9000"
            - name: S3_REGION
              value: home
            - name: NUXT_PUBLIC_AUTH_REQUIRED
              value: "true"
            - name: API_KEY_MANAGER_URL
              value: https://api-key-manager.home.maximemoreillon.com
          envFrom:
            - secretRef:
                name: food-manager-env-from-vault
          resources: {}

---
apiVersion: v1
kind: Service
metadata:
  name: food-manager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: food-manager
  ports:
    - port: 80

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: food-manager-env
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: food-manager-env-from-vault
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: food-manager
    - extract:
        key: openai
  data:
    # S3
    # - secretKey: S3_ACCESS_KEY_ID
    #   remoteRef:
    #     key: minio-main-access-keys
    #     property: ACCESS_KEY_ID
    # - secretKey: S3_SECRET_ACCESS_KEY
    #   remoteRef:
    #     key: minio-main-access-keys
    #     property: SECRET_ACCESS_KEY
    # OIDC
    - secretKey: NUXT_OAUTH_OIDC_CLIENT_ID
      remoteRef:
        key: keycloak-main-client
        property: CLIENT_ID
    - secretKey: NUXT_OAUTH_OIDC_CLIENT_SECRET
      remoteRef:
        key: keycloak-main-client
        property: CLIENT_SECRET
    - secretKey: NUXT_OAUTH_OIDC_OPENID_CONFIG
      remoteRef:
        key: keycloak-main-client
        property: OPENID_CONFIG
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: food-manager
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Food manager
    gethomepage.dev/icon: mdi-food
    gethomepage.dev/group: 1P
spec:
  hostnames:
    - food.home.maximemoreillon.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: food-manager
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
